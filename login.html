<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Log Masuk &mdash; KomunitiKu @ KKBM</title>
<link rel="stylesheet" href="nav.css"/>
<link rel="stylesheet" href="design.css"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#0d1117;--surface:#161b22;--border:#2d3748;--teal:#14b8a6;--teal-light:#2dd4bf;--teal-dim:#0d9488;--text:#e2e8f0;--muted:#8b949e;--white:#fff;--red:#f87171;}
  body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:15px;min-height:100vh;display:flex;flex-direction:column;}
  a{color:var(--teal);text-decoration:none;}
  nav{background:rgba(13,17,23,0.97);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px;}
  .nav-logo{display:flex;align-items:center;gap:10px;}
  .nav-logo-icon{width:36px;height:36px;background:var(--teal);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;}
  .nav-logo-text{font-size:16px;font-weight:700;color:var(--white);}
  .nav-logo-text span{color:var(--teal);}
  .wrap{max-width:420px;margin:80px auto;padding:0 1.5rem;flex:1;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:36px;}
  h1{font-size:1.6rem;font-weight:800;color:var(--white);margin-bottom:6px;}
  .sub{font-size:14px;color:var(--muted);margin-bottom:28px;}
  .form-group{margin-bottom:18px;}
  label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;}
  input{width:100%;background:#0d1117;border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-size:14px;outline:none;transition:border-color 0.2s;}
  input:focus{border-color:var(--teal);}
  .btn{width:100%;background:var(--teal);color:#fff;font-weight:700;font-size:15px;padding:13px;border-radius:10px;border:none;cursor:pointer;transition:background 0.2s;margin-top:6px;}
  .btn:hover{background:var(--teal-dim);}
  .btn-demo{width:100%;background:transparent;border:1px solid var(--border);color:var(--text);font-weight:600;font-size:14px;padding:11px;border-radius:10px;cursor:pointer;transition:border-color 0.2s,color 0.2s;margin-top:10px;}
  .btn-demo:hover{border-color:var(--teal);color:var(--teal);}
  .msg{display:none;padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:16px;}
  .msg.success{background:#0d2926;border:1px solid var(--teal-dim);color:var(--teal-light);}
  .msg.error{background:#2d1515;border:1px solid #991b1b;color:var(--red);}
  .reg-link{text-align:center;font-size:13px;color:var(--muted);margin-top:16px;}
  .demo-hint{background:#0d1f1e;border:1px solid #0d9488;border-radius:10px;padding:12px 14px;font-size:12px;color:var(--muted);margin-bottom:20px;}
  .demo-hint strong{color:var(--teal-light);}
  footer{text-align:center;padding:20px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);margin-top:auto;}
</style>
</head>
<body>
<nav id="main-nav"></nav>

<div class="wrap">
  <div class="card">
    <h1>Log Masuk</h1>
    <p class="sub">Selamat kembali ke KomunitiKu @ KKBM.</p>
    <div class="demo-hint">&#128161; <strong>Demo Mode:</strong> Gunakan sebarang emel &amp; kata laluan (min. 6 aksara) untuk log masuk, atau klik butang Demo.</div>
    <div class="msg" id="msg"></div>
    <div class="form-group"><label>Emel</label><input type="email" id="emel" placeholder="emel@contoh.com"/></div>
    <div class="form-group"><label>Kata Laluan</label><input type="password" id="pass" placeholder="Kata laluan anda"/></div>
    <button class="btn" onclick="login()">Log Masuk &rarr;</button>
    <button class="btn-demo" onclick="demoLogin()">&#9654; Cuba Demo (Pelajar)</button>
    <button class="btn-demo" onclick="adminLogin()" style="margin-top:6px;">&#9654; Cuba Demo (Admin)</button>
    <div class="reg-link">Belum ada akaun? <a href="daftar.html">Daftar percuma di sini</a></div>
  </div>
</div>

<footer>&copy; 2025 KomunitiKu @ KKBM</footer>

<script src="logo.js"></script>
<script src="nav.js"></script>
<script src="ui.js"></script>
<script>
function login(){
  var msg=document.getElementById('msg');
  var emel=document.getElementById('emel').value.trim();
  var pass=document.getElementById('pass').value;
  if(!emel||!pass){msg.className='msg error';msg.style.display='block';msg.textContent='Sila masukkan emel dan kata laluan.';return;}
  if(pass.length<6){msg.className='msg error';msg.style.display='block';msg.textContent='Kata laluan terlalu pendek.';return;}
  var name=emel.split('@')[0];
  name=name.charAt(0).toUpperCase()+name.slice(1);
  localStorage.setItem('kkbm_user',JSON.stringify({nama:name,emel:emel,role:'pelajar'}));
  msg.className='msg success';msg.style.display='block';msg.textContent='Log masuk berjaya! Mengalihkan ke Dashboard Pelajar...';
  setTimeout(function(){window.location='dashboard-pelajar.html';},1200);
}
function demoLogin(){
  localStorage.setItem('kkbm_user',JSON.stringify({nama:'Ahmad Faris',emel:'ahmad@demo.com',role:'pelajar',kawasan:'Bukit Mertajam'}));
  window.location='dashboard-pelajar.html';
}
function adminLogin(){
  localStorage.setItem('kkbm_user',JSON.stringify({nama:'Admin KKBM',emel:'admin@kkbm.edu.my',role:'admin'}));
  window.location='dashboard-admin.html';
}
</script>
<script src="ai-genie.js"></script>
</body>
</html>
