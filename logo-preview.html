<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Logo Preview — KomunitiKu</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:#0d1117;color:#e2e8f0;padding:40px;display:flex;flex-direction:column;gap:32px;}
  .row{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
  .label{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px;}
  .swatch{background:#161b22;border:1px solid #2d3748;border-radius:12px;padding:20px 28px;display:inline-flex;align-items:center;justify-content:center;}
  .swatch.light{background:#f5f5f5;}
</style>
</head>
<body>
<div>
  <div class="label">Full Wordmark — Dark background</div>
  <div class="row">
    <div class="swatch" id="full-sm"></div>
    <div class="swatch" id="full-md"></div>
    <div class="swatch" id="full-lg"></div>
  </div>
</div>
<div>
  <div class="label">Full Wordmark — Light background</div>
  <div class="row">
    <div class="swatch light" id="full-light"></div>
  </div>
</div>
<div>
  <div class="label">Icon only — Various sizes</div>
  <div class="row" id="icons-row"></div>
</div>
<div>
  <div class="label">Nav bar simulation</div>
  <div style="background:rgba(13,17,23,0.97);border:1px solid #2d3748;border-radius:10px;padding:0 24px;display:flex;align-items:center;height:64px;" id="nav-sim"></div>
</div>

<script src="logo.js"></script>
<script>
  document.getElementById('full-sm').innerHTML = LOGO_SVG.full(28);
  document.getElementById('full-md').innerHTML = LOGO_SVG.full(36);
  document.getElementById('full-lg').innerHTML = LOGO_SVG.full(48);

  // Light version — swap text colour
  var lightSvg = LOGO_SVG.full(36)
    .replace(/fill="#e2e8f0"/g,'fill="#1f2328"')
    .replace(/fill="#8b949e"/g,'fill="#57606a"');
  document.getElementById('full-light').innerHTML = lightSvg;

  var sizes = [16,24,32,40,48,64];
  var iconsRow = document.getElementById('icons-row');
  sizes.forEach(function(s){
    var wrap = document.createElement('div');
    wrap.className = 'swatch';
    wrap.style.padding = '12px';
    wrap.title = s+'px';
    wrap.innerHTML = LOGO_SVG.icon(s);
    var lbl = document.createElement('div');
    lbl.style.cssText = 'font-size:10px;color:#8b949e;text-align:center;margin-top:6px;';
    lbl.textContent = s+'px';
    wrap.appendChild(lbl);
    wrap.style.flexDirection='column';
    iconsRow.appendChild(wrap);
  });

  document.getElementById('nav-sim').innerHTML =
    '<a href="#" style="display:flex;align-items:center;text-decoration:none;">' + LOGO_SVG.full(34) + '</a>' +
    '<div style="display:flex;gap:28px;margin-left:36px;">' +
      ['Kursus','Dashboard','Sijil','AI Helpdesk'].map(function(l){
        return '<a href="#" style="color:#8b949e;font-size:14px;font-weight:500;text-decoration:none;">'+l+'</a>';
      }).join('') +
    '</div>' +
    '<div style="margin-left:auto;background:#14b8a6;color:#fff;font-size:13px;font-weight:700;padding:8px 20px;border-radius:8px;">Daftar Sekarang</div>';
</script>
</body>
</html>
